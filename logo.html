<!DOCTYPE html>
<html>
<head>
    <title>Dashboard SultanKing Store</title>
</head>
<body> <!-- 📌 Cari tag pembuka body ini -->


    <!-- 🔴 TEMPELKAN KODE LOGO DI SINI (Tepat di bawah tag body) -->
    <div style="
        text-align: center; 
        padding: 20px 10px; 
        background-color: #1a1a1a; /* Warna latar belakang gelap agar logo emas menyala */
        border-bottom: 2px solid #d4af37; /* Garis pembatas warna emas */
        margin-bottom: 30px;
    ">
        <!-- Panggil file gambar logo Anda -->
        <img src="logo.jpg" alt="SultanKing Store Logo" style="
            max-width: 280px; /* Mengatur lebar maksimal logo di HP/Laptop */
            height: auto;
            display: block;
            margin: 0 auto;
        ">
    </div>
    <!-- 🔴 SELESAI KODE LOGO -->


    <!-- KODE DASHBOARD LAMA ANDA DI BAWAH INI JANGAN DIHAPUS -->
    <h1>Selamat Datang di SultanKing_Store</h1>
    <p>"Kerja keras bagai kuda,masa beli cemilan Rp 5000 aja mikirnya dua hari dua malam?"</p>

</body>
</html>
